         <h1>Contacto</h1>

    <p>Estamos aquí para ayudarte. Contáctanos y empieza tu entrenamiento con Titan Fitness.</p>

    <form class="formulario-contacto">

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" placeholder="Escribe tu nombre" required>
        <label for="telefono">Teléfono:</label>
<input type="tel" id="telefono" placeholder="Escribe tu teléfono" required>

        <label for="correo">Correo:</label>
        <input type="email" id="correo" placeholder="Escribe tu correo" required>

        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" placeholder="Escribe tu mensaje" required></textarea>

        <button type="submit">Enviar</button>

    </form>
