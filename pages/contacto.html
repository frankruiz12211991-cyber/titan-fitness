    <section class="contacto">


         <h1>Contacto</h1>

    <p>Estamos aquí para ayudarte. Contáctanos y empieza tu entrenamiento con Titan Fitness.</p>

    <form class="formulario-contacto">

    <label for="nombre">Nombre:</label>
    <input type="text"
           id="nombre"
           name="nombre"
           placeholder="Escribe tu nombre"
           autocomplete="name"
           required>

    <label for="telefono">Teléfono:</label>
    <input type="tel"
           id="telefono"
           name="telefono"
           placeholder="Escribe tu teléfono"
           autocomplete="tel"
           required>

    <label for="correo">Correo:</label>
    <input type="email"
           id="correo"
           name="correo"
           placeholder="Escribe tu correo"
           autocomplete="email"
           required>

    <label for="mensaje">Mensaje:</label>
    <textarea id="mensaje"
              name="mensaje"
              placeholder="Escribe tu mensaje"
              required></textarea>

    <button type="submit">Enviar</button>

</form>


    </section>
